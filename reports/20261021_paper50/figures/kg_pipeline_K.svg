<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="118.75mm" viewBox="0 0 1440 950" role="img" aria-labelledby="title desc">
<title id="title">문장 분석과 KG 지식을 활용한 방언 변환 구조</title>
<desc id="desc">표준어의 저장된 Qwen 분석과 Kiwi 분석으로 지식 항목 및 어휘 활용 관계를 조회한다. 조회 중 조건 검사와 변환안 작성을 수행하고 우선순위와 분량에 따라 후보를 선택한다. 원문, 분석, 변환 계획, 선택된 관계와 보존 지침을 Qwen에 제공한다. 생성 후 보존 검사와 필요시 최대 한 번 수정 및 재검사로 최종 출력을 선택한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#41576a"/></marker></defs>
<rect width="1440" height="950" fill="white"/>
<g font-family="Noto Sans CJK KR, sans-serif"><rect x="40" y="35" width="280" height="100" rx="12" fill="#f4f7fa" stroke="#41576a" stroke-width="2"/><text x="180" y="79" font-size="29" font-weight="700" text-anchor="middle" fill="#1d2d3a"><tspan x="180" dy="0">표준어 원문</tspan></text><text x="180" y="115" font-size="23" font-weight="400" text-anchor="middle" fill="#1d2d3a"><tspan x="180" dy="0">번역할 전체 발화</tspan></text><rect x="395" y="25" width="650" height="120" rx="12" fill="#edf4f5" stroke="#41576a" stroke-width="2"/><text x="720" y="65" font-size="29" font-weight="700" text-anchor="middle" fill="#1d2d3a"><tspan x="720" dy="0">방언 지식 저장소 (KG)</tspan></text><text x="720" y="104" font-size="25" font-weight="400" text-anchor="middle" fill="#1d2d3a"><tspan x="720" dy="0">표현 · 적용 조건 · 출처 / 어휘–활용 연결</tspan></text><text x="720" y="135" font-size="22" font-weight="400" text-anchor="middle" fill="#1d2d3a"><tspan x="720" dy="0">지식 항목과 그래프 관계를 함께 사용</tspan></text><rect x="40" y="235" width="280" height="375" rx="12" fill="#ffffff" stroke="#41576a" stroke-width="2"/><rect x="40" y="235" width="280" height="65" rx="12" fill="#e8eef4" stroke="#41576a" stroke-width="2"/><text x="180" y="278" font-size="27" font-weight="700" text-anchor="middle" fill="#1d2d3a"><tspan x="180" dy="0">① 원문 분석 정보</tspan></text><text x="65" y="344" font-size="24" font-weight="400" text-anchor="start" fill="#1d2d3a"><tspan x="65" dy="0">Qwen 문장 분석¹</tspan><tspan x="65" dy="38">의미 · 질문/요청 · 높임</tspan></text><line x1="60" y1="405" x2="300" y2="405" stroke="#acb9c2" stroke-width="1.5"/><text x="65" y="450" font-size="24" font-weight="400" text-anchor="start" fill="#1d2d3a"><tspan x="65" dy="0">Kiwi 단어·어미 분석</tspan><tspan x="65" dy="38">기본형 · 어미 · 위치</tspan></text><text x="65" y="559" font-size="23" font-weight="400" text-anchor="start" fill="#1d2d3a"><tspan x="65" dy="0">같은 원문에 맞춰</tspan><tspan x="65" dy="32">두 분석 정보를 사용</tspan></text><rect x="365" y="235" width="355" height="375" rx="12" fill="#ffffff" stroke="#41576a" stroke-width="2"/><rect x="365" y="235" width="355" height="65" rx="12" fill="#e8eef4" stroke="#41576a" stroke-width="2"/><text x="542.5" y="278" font-size="27" font-weight="700" text-anchor="middle" fill="#1d2d3a"><tspan x="542.5" dy="0">② 조회·변환안 작성</tspan></text><text x="388" y="344" font-size="25" font-weight="400" text-anchor="start" fill="#1d2d3a"><tspan x="388" dy="0">지식 항목 직접 검색</tspan><tspan x="388" dy="43">어휘–활용 관계 탐색</tspan><tspan x="388" dy="43">종결·구성 변환안 작성</tspan></text><text x="388" y="481" font-size="23" font-weight="400" text-anchor="start" fill="#1d2d3a"><tspan x="388" dy="0">위 과정에 조건 검사 포함</tspan></text><line x1="385" y1="500" x2="700" y2="500" stroke="#acb9c2" stroke-width="1.5"/><text x="542.5" y="544" font-size="25" font-weight="700" text-anchor="middle" fill="#1d2d3a"><tspan x="542.5" dy="0">후보 선택</tspan></text><text x="542.5" y="581" font-size="23" font-weight="400" text-anchor="middle" fill="#1d2d3a"><tspan x="542.5" dy="0">우선순위 · 중복 · 분량 제한</tspan></text><rect x="765" y="235" width="300" height="375" rx="12" fill="#ffffff" stroke="#41576a" stroke-width="2"/><rect x="765" y="235" width="300" height="65" rx="12" fill="#e8eef4" stroke="#41576a" stroke-width="2"/><text x="915" y="278" font-size="27" font-weight="700" text-anchor="middle" fill="#1d2d3a"><tspan x="915" dy="0">③ 생성 입력 구성</tspan></text><text x="789" y="345" font-size="25" font-weight="400" text-anchor="start" fill="#1d2d3a"><tspan x="789" dy="0">원문</tspan><tspan x="789" dy="45">문장 분석</tspan><tspan x="789" dy="45">구간별 변환 계획</tspan><tspan x="789" dy="45">선택된 관계 정보²</tspan><tspan x="789" dy="45">의미·높임 보존 지침</tspan></text><text x="915" y="588" font-size="21" font-weight="400" text-anchor="middle" fill="#1d2d3a"><tspan x="915" dy="0">공통 번역 지시와 함께 전달</tspan></text><rect x="1110" y="235" width="290" height="135" rx="12" fill="#e8f1f3" stroke="#41576a" stroke-width="2"/><text x="1255" y="287" font-size="27" font-weight="700" text-anchor="middle" fill="#1d2d3a"><tspan x="1255" dy="0">④ Qwen 번역 생성</tspan></text><text x="1255" y="333" font-size="25" font-weight="400" text-anchor="middle" fill="#1d2d3a"><tspan x="1255" dy="0">최초 방언 발화</tspan></text><rect x="1110" y="455" width="290" height="190" rx="12" fill="#ffffff" stroke="#41576a" stroke-width="2"/><text x="1255" y="500" font-size="26" font-weight="700" text-anchor="middle" fill="#1d2d3a"><tspan x="1255" dy="0">⑤ 보존 검사·수정</tspan></text><text x="1255" y="542" font-size="22" font-weight="400" text-anchor="middle" fill="#1d2d3a"><tspan x="1255" dy="0">강한 경고 시 Qwen 수정</tspan><tspan x="1255" dy="35">최대 1회 · 수정본 재검사</tspan><tspan x="1255" dy="35">검사 결과에 따라 최종 선택</tspan></text><rect x="1110" y="720" width="290" height="90" rx="12" fill="#e8f1f3" stroke="#41576a" stroke-width="2"/><text x="1255" y="774" font-size="28" font-weight="700" text-anchor="middle" fill="#1d2d3a"><tspan x="1255" dy="0">최종 방언 발화</tspan></text><polyline points="180,135 180,235" fill="none" stroke="#41576a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="542,145 542,235" fill="none" stroke="#41576a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="320,420 365,420" fill="none" stroke="#41576a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="720,420 765,420" fill="none" stroke="#41576a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1065,420 1087,420 1087,303 1110,303" fill="none" stroke="#41576a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="1255,370 1255,455" fill="none" stroke="#41576a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1270" y="418" font-size="21" font-weight="400" text-anchor="start" fill="#1d2d3a"><tspan x="1270" dy="0">최초 출력</tspan></text><polyline points="1255,645 1255,720" fill="none" stroke="#41576a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="40" y="700" font-size="25" font-weight="700" text-anchor="start" fill="#1d2d3a"><tspan x="40" dy="0">적용 범위: 최근 50개 발화 실험의 KG 사용 조건(K)</tspan></text><text x="40" y="750" font-size="23" font-weight="400" text-anchor="start" fill="#1d2d3a"><tspan x="40" dy="0">¹ Qwen 분석은 저장된 결과를 재사용했으며, Kiwi 분석과 조회는 다시 수행했다.</tspan><tspan x="40" dy="40">² 관계 정보는 선택된 후보 사이의 연결이 있을 때만 포함한다.</tspan></text><text x="40" y="875" font-size="23" font-weight="400" text-anchor="start" fill="#1d2d3a"><tspan x="40" dy="0">조회·변환안 작성과 후보 선택은 코드가 수행한다.</tspan><tspan x="40" dy="38">Qwen은 전달된 정보를 참고해 번역하며, 필요할 때 수정 요청을 받는다.</tspan></text></g></svg>